ext x="1060.0" y="711.05" text-anchor="middle" font-size="13" font-weight="normal">Đếm lỗi của kênh; sau N lần liên tiếp:</text><text x="1060.0" y="728.05" text-anchor="middle" font-size="13" font-weight="normal">chất lượng = LỖI, báo trong chẩn đoán</text><polyline points="420,765 420,805" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="430" y="796.55" text-anchor="start" font-size="13" font-weight="normal">Được</text><rect x="170.0" y="805" width="500" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="835.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi mẫu thô + nhãn thời gian vào kho;</text><text x="420.0" y="853.9" text-anchor="middle" font-size="14" font-weight="normal">chất lượng = TỐT, xóa bộ đếm lỗi</text><polyline points="420,875 420,915" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="170.0" y="915" width="500" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="945.9" text-anchor="middle" font-size="14" font-weight="normal">Cập nhật kênh dẫn xuất (nếu có):</text><text x="420.0" y="963.9" text-anchor="middle" font-size="14" font-weight="normal">đổi đơn vị, công suất, cực đại/cực tiểu</text><polyline points="420,985 420,1025" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="420,1025.0 590.0,1075 420,1125.0 250.0,1075" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420" y="1079.9" text-anchor="middle" font-size="14" font-weight="normal">Còn nguồn khác?</text><polyline points="250,1075 60,1075 60,205 170.0,205" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="110" y="1064.55" text-anchor="middle" font-size="13" font-weight="normal">Còn</text><polyline points="1060,755 1060,1075 590,1075" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="420,1125 420,1155" fill="none" stroke="#000" stroke-width="1.5" marker-end="ur