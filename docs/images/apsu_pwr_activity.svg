35.0 280.0,985" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430" y="989.9" text-anchor="middle" font-size="14" font-weight="normal">Còn cụm khác?</text><polyline points="280,985 100,985 100,360 190.0,360" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="160" y="974.55" text-anchor="middle" font-size="13" font-weight="normal">Còn</text><polyline points="430,1035 430,1070" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="440" y="1062.55" text-anchor="start" font-size="13" font-weight="normal">Hết</text><rect x="190.0" y="1070" width="480" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430.0" y="1100.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi kết quả (đúng, hoặc có cụm bị từ chối)</text><text x="430.0" y="1118.9" text-anchor="middle" font-size="14" font-weight="normal">vào bản tin giám sát; không có ACK</text><polyline points="430,1140 430,1170" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="430" cy="1186" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><circle cx="430" cy="1186" r="9" fill="#000"/></svg>