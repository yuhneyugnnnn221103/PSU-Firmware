<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1230" viewBox="0 0 1340 1230" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="430" cy="28" r="16" fill="#000" stroke="#000" stroke-width="1.6"/><polyline points="430,44 430,70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="190.0" y="70" width="480" height="64" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430.0" y="97.9" text-anchor="middle" font-size="14" font-weight="normal">Nhận Mask (bit 0..3 tương ứng cụm 1..4)</text><text x="430.0" y="115.9" text-anchor="middle" font-size="14" font-weight="normal">và cờ ClearTrip từ khối xử lý bản tin</text><polyline points="430,134 430,165" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="430,165.0 580.0,215 430,265.0 280.0,215" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430" y="219.9" text-anchor="middle" font-size="14" font-weight="normal">ClearTrip = 1?</text><polyline points="580,215 780,215" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="645" y="204.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="780" y="170" width="440" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1000.0" y="202.55" text-anchor="middle" font-size="13" font-weight="normal">Ghi nhớ cụm đang TRIPPED, xóa mã trip và cờ</text><text x="1000.0" y="219.55" text-anchor="middle" font-size="13" font-weight="normal">của INA228, đưa cụm TRIPPED về OFF</text><text x="1000.0" y="236.55" text-anchor="middle" font-size="13" font-weight="normal">và hủy yêu cầu bật</text><polyline points="430,265 430,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="440" y="302.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><polyline points="1000,260 1000,360 670.0,360" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="190.0" y="330" width="480" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430.0" y="364.9" text-anchor="middle" font-size="14" font-weight="normal">Lặp lần lượt cho từng cụm c = 1..4</text><polyline points="430,390 430,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="430,420.0 600.0,470 430,520.0 260.0,470" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430" y="474.9" text-anchor="middle" font-size="14" font-weight="normal">Cụm c có phần cứng EN?</text><polyline points="600,470 780,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="665" y="459.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="780" y="440" width="420" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="474.55" text-anchor="middle" font-size="13" font-weight="normal">Bỏ qua cụm (chỉ nhận yêu cầu tắt)</text><polyline points="430,520 430,550" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="440" y="544.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><polygon points="430,550.0 600.0,600 430,650.0 260.0,600" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="430" y="604.9" text-anchor="middle" font-size="14" font-weight="normal">Bit c của Mask = 1 (bật)?</text><polyline points="600,600 780,600" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="665" y="589.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="780" y="570" width="420" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="604.55" text-anchor="middle" font-size="13" font-weight="no