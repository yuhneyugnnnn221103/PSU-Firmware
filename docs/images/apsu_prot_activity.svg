<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="400" cy="28" r="16" fill="#000" stroke="#000" stroke-width="1.6"/><polyline points="400,44 400,70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="150.0" y="70" width="500" height="80" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="106.05" text-anchor="middle" font-size="13" font-weight="normal">Gom dữ liệu của cụm: cờ lỗi tích lũy INA228 (lọc theo</text><text x="400.0" y="123.05" text-anchor="middle" font-size="13" font-weight="normal">mặt nạ của trạng thái), FT của DCM, độ tươi mẫu đo</text><polyline points="400,150 400,185" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="400,185.0 600.0,235 400,285.0 200.0,235" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="239.9" text-anchor="middle" font-size="14" font-weight="normal">Có cờ nhanh từ ngắt ALERT?</text><polyline points="600,235 820,235" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="640" y="224.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="820" y="190.0" width="400" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1020.0" y="231.2" text-anchor="middle" font-size="12" font-weight="normal">Cụm ON hoặc ARMING: EN đã cắt trong ngắt.</text><text x="1020.0" y="247.2" text-anchor="middle" font-size="12" font-weight="normal">Chuyển TRIPPED, đếm trip, mã tạm chưa biết</text><polyline points="1220,235 1330,235" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,285 400,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="319.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><polygon points="400,330.0 610.0,380 400,430.0 190.0,380" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="384.9" text-anchor="middle" font-size="14" font-weight="normal">Cụm ARMING và FT của DCM tích cực?</text><polyline points="610,380 820,380" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="645" y="369.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="820" y="340.0" width="400" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1020.0" y="376.2" text-anchor="middle" font-size="12" font-weight="normal">Cắt EN ngay, mã = lỗi DCM, đếm trip.</text><text x="1020.0" y="392.2" text-anchor="middle" font-size="12" font-weight="normal">Chuyển TRIPPED</text><polyline points="1220,380 1330,380" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,430 400,475" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="464.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><polygon points="400,470.0 620.0,525 400,580.0 180.0,525" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="521.2" text-anchor="middle" font-size="12" font-weight="normal">Cụm ON và có sự cố? (cờ INA, FT DCM,</text><text x="400" y="537.2" text-anchor="middle" font-size="12" font-weight="normal">vượt ngưỡng 2 mẫu mới liên tiếp)</text><polyline points="620,525 820,525" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="650" y="514.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="820" y="475.0" width="400" height="100" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1020.0" y="513.2" text-anchor="middle" font-size="12" font-weight="normal">Cắt EN. Phân loại mã: DCM &gt; INA (quá dòng, quá áp,</text><text x="1020.0" y="529.2" text-anchor="middle" font-size="12" font-weight="normal">quá nhiệt, sụt áp) &gt; ngưỡng &gt; bus. Ghi bit trip,</text><text x="1020.0" y="545.2" text-anchor="middle" font-size="12" font-weight="normal">đếm trip. Chuyển TRIPPED</text><polyline points="1220,525 1330,525" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,580 400,625" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="614.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><polygon points="400,625.0 600.0,675 400,725.0 200.0,675" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="679.9" text-anchor="middle" font-size="14" font-weight="normal">Cụm đang TRIPPED?</text><polyline points="600,675 820,675" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="640" y="664.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="820" y="630.0" width="400" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1020.0" y="671.2" text-anchor="middle" font-size="12" font-weight="normal">Ghi EN = 0 mỗi vòng. Sau 100 ms vét mã lỗi</text><text x="1020.0" y="687.2" text-anchor="middle" font-size="12" font-weight="normal">nếu chưa biết. Giữ cho đến ClearTrip</text><polyline points="1220,675 1330,675" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,725 400,770" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="759.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><polygon points="400,770.0 610.0,820 400,870.0 190.0,820" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="824.9" text-anchor="middle" font-size="14" font-weight="normal">Mất liên lạc I2C với mọi INA của cụm?</text><polyline points="610,820 820,820" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="645" y="809.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="820" y="780.0" width="400" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1020.0" y="816.2" text-anchor="middle" font-size="12" font-weight="normal">Chỉ cảnh báo (LED). Cắt nguồn nếu bật tùy chọn</text><text x="1020.0" y="832.2" text-anchor="middle" font-size="12" font-weight="normal">SAFE_TRIP_ON_BUS_LOSS (mặc định tắt)</text><polyline points="1220,820 1330,820" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,870 400,935" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="914.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><rect x="150.0" y="935" width="500" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="969.9" text-anchor="middle" font-size="14" font-weight="normal">Cuối vòng: cập nhật cờ LED, sang cụm kế tiếp</text><polyline points="1330,235 1330,965 650.0,965" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="400,995 400,1030" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="400" cy="1046" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><circle cx="400" cy="1046" r="9" fill="#000"/></svg>