<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1260" viewBox="0 0 1700 1260" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="360" cy="28" r="16" fill="#000" stroke="#000" stroke-width="1.6"/><polyline points="360,44 360,80" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,80.0 530.0,130 360,180.0 190.0,130" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="134.9" text-anchor="middle" font-size="14" font-weight="normal">Đến chu kỳ quét (60 ms)?</text><polyline points="530,130 680,130" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="595" y="119.55" text-anchor="middle" font-size="13" font-weight="normal">Chưa</text><rect x="680" y="100" width="300" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="830.0" y="134.55" text-anchor="middle" font-size="13" font-weight="normal">Chờ vòng chính kế tiếp</text><polyline points="360,180 360,230" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="214.55" text-anchor="start" font-size="13" font-weight="normal">Đến</text><polygon points="360,230.0 530.0,280 360,330.0 190.0,280" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="284.9" text-anchor="middle" font-size="14" font-weight="normal">Bus I2C đang bận?</text><polyline points="530,280 680,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="595" y="269.55" text-anchor="middle" font-size="13" font-weight="normal">Bận</text><rect x="680" y="250" width="300" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="830.0" y="284.55" text-anchor="middle" font-size="13" font-weight="normal">Bỏ qua chu kỳ này</text><polyline points="360,330 360,365" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="357.55" text-anchor="start" font-size="13" font-weight="normal">Rảnh</text><rect x="140" y="365" width="440" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="390.9" text-anchor="middle" font-size="14" font-weight="normal">Bắt đầu quét: INA đầu tiên, thanh ghi đầu</text><text x="360.0" y="408.9" text-anchor="middle" font-size="14" font-weight="normal">(đặt bus ở trạng thái bận)</text><polyline points="360,425 360,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="140" y="470" width="440" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="500.9" text-anchor="middle" font-size="14" font-weight="normal">Phát lệnh đọc thanh ghi bằng I2C DMA</text><text x="360.0" y="518.9" text-anchor="middle" font-size="14" font-weight="normal">(ngắt DMA báo đã xong hoặc lỗi)</text><polyline points="360,540 360,575" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,575.0 510.0,625 360,675.0 210.0,625" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="629.9" text-anchor="middle" font-size="14" font-weight="normal">Đọc thành công?</text><polyline points="510,625 680,625" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="575" y="614.55" text-anchor="middle" font-size="13" font-weight="normal">Lỗi</text><rect x="680" y="570" width="300" height="110" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="830.0" y="604.05" text-anchor="middle" font-size="13" font-weight="normal">Lỗi I2C: đếm lỗi kênh, bỏ kênh,</text><text x="830.0" y="621.05" text-anchor="middle" font-size="13" font-weight="normal">sang kênh sau (không thử lại).</text><text x="830.0" y="638.05" text-anchor="middle" font-size="13" font-weight="normal">Quá 10 ms không có ngắt: vòng chính</text><text x="830.0" y="655.05" text-anchor="middle" font-size="13" font-weight="normal">hủy cả chu kỳ, đếm quá hạn</text><polyline points="360,675 360,715" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="707.55" text-anchor="start" font-size="13" font-weight="normal">Được</text><rect x="140" y="715" width="440" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="749.9" text-anchor="middle" font-size="14" font-weight="normal">Lưu giá trị thanh ghi vào dữ liệu đo</text><polyline points="360,775 360,810" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,810.0 570.0,865 360,920.0 150.0,865" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="861.05" text-anchor="middle" font-size="13" font-weight="normal">Còn thanh ghi trong dãy?</text><text x="360" y="878.05" text-anchor="middle" font-size="13" font-weight="normal">(ADC_CONFIG, VBUS, CURRENT, DIETEMP)</text><polyline points="150,865 80,865 80,515 140,515" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="150" y="854.55" text-anchor="middle" font-size="13" font-weight="normal">Còn</text><polyline points="360,920 360,965" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="952.55" text-anchor="start" font-size="13" font-weight="normal">Hết</text><rect x="140" y="965" width="440" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="999.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi nhãn thời gian cho INA vừa đọc xong</text><polyline points="360,1025 360,1060" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,1060.0 510.0,1110 360,1160.0 210.0,1110" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="1114.9" text-anchor="middle" font-size="14" font-weight="normal">Còn INA khác?</text><polyline points="210,1110 30,1110 30,490 140,490" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="95" y="1099.55" text-anchor="middle" font-size="13" font-weight="normal">Còn</text><polyline points="830,680 830,1110 510,1110" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="360,1160 360,1190" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="360" cy="1206" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="1210.55" text-anchor="middle" font-size="13" font-weight="bold">A</text><text x="370" y="1182.55" text-anchor="start" font-size="13" font-weight="normal">Hết</text><circle cx="1420" cy="28" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420" y="32.55" text-anchor="middle" font-size="13" font-weight="bold">A</text><polyline points="1420,44 1420,80" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="1190" y="80" width="460" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420.0" y="110.9" text-anchor="middle" font-size="14" font-weight="normal">Vòng chính thu kết quả quét,</text><text x="1420.0" y="128.9" text-anchor="middle" font-size="14" font-weight="normal">bus I2C về trạng thái rảnh</text><polyline points="1420,150 1420,190" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="1190" y="190" width="460" height="80" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420.0" y="225.9" text-anchor="middle" font-size="14" font-weight="normal">Xử lý ALERT: đọc DIAG_ALRT khi chân ALERT kích</text><text x="1420.0" y="243.9" text-anchor="middle" font-size="14" font-weight="normal">hoặc mỗi 250 ms; cập nhật cờ tích lũy</text><polyline points="1420,270 1420,310" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="1420,310.0 1580.0,360 1420,410.0 1260.0,360" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420" y="364.9" text-anchor="middle" font-size="14" font-weight="normal">Có cấu hình mới (04 04)?</text><polyline points="1260,360 1130,360" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1220" y="349.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="890" y="325" width="240" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1010.0" y="356.05" text-anchor="middle" font-size="13" font-weight="normal">Nạp lại 9 thanh ghi,</text><text x="1010.0" y="373.05" text-anchor="middle" font-size="13" font-weight="normal">khởi tạo lại INA228</text><polyline points="1010,395 1010,470 1190,470" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="1420,410 1420,440" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1430" y="434.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><rect x="1190" y="440" width="460" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420.0" y="465.9" text-anchor="middle" font-size="14" font-weight="normal">Đồng bộ ngưỡng xuống INA228</text><text x="1420.0" y="483.9" text-anchor="middle" font-size="14" font-weight="normal">(ngưỡng dưới chỉ bật khi cụm đang ON)</text><polyline points="1420,500 1420,735" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="1420,735.0 1600.0,790 1420,845.0 1240.0,790" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420" y="786.05" text-anchor="middle" font-size="13" font-weight="normal">Mỗi 250 ms: INA đáp lại</text><text x="1420" y="803.05" text-anchor="middle" font-size="13" font-weight="normal">nhưng cấu hình sai?</text><polyline points="1240,790 1130,790" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1205" y="779.55" text-anchor="middle" font-size="13" font-weight="normal">Có</text><rect x="890" y="760" width="240" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1010.0" y="794.55" text-anchor="middle" font-size="13" font-weight="normal">Khởi tạo lại INA228</text><polyline points="1010,820 1010,915 1190,915" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="1420,845 1420,880" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1430" y="872.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><rect x="1190" y="880" width="460" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1420.0" y="911.05" text-anchor="middle" font-size="13" font-weight="normal">Dữ liệu đo mới nhất (dòng, nhiệt độ, nhãn</text><text x="1420.0" y="928.05" text-anchor="middle" font-size="13" font-weight="normal">thời gian) nằm trong bộ nhớ, chờ ACTL hỏi 02 02</text><polyline points="1420,950 1420,990" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="1420" cy="1006" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><circle cx="1420" cy="1006" r="9" fill="#000"/></svg>