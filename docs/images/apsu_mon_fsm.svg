<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="430" y="45.6" text-anchor="middle" font-size="16" font-weight="bold">Trạng thái bus quét INA228</text><rect x="40" y="160" width="230" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="155.0" y="195.6" text-anchor="middle" font-size="16" font-weight="bold">IDLE</text><text x="155.0" y="228.55" text-anchor="middle" font-size="13" font-weight="normal">rảnh, chờ chu kỳ quét</text><rect x="430" y="160" width="230" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="545.0" y="195.6" text-anchor="middle" font-size="16" font-weight="bold">BUSY</text><text x="545.0" y="228.55" text-anchor="middle" font-size="13" font-weight="normal">đang đọc bằng I2C DMA</text><rect x="820" y="160" width="230" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="935.0" y="195.6" text-anchor="middle" font-size="16" font-weight="bold">DONE</text><text x="935.0" y="228.55" text-anchor="middle" font-size="13" font-weight="normal">đã đọc xong mọi kênh</text><polyline points="270,205 430,205" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="350" y="174.2" text-anchor="middle" font-size="12" font-weight="normal">đến chu kỳ 60 ms</text><polyline points="660,205 820,205" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="740" y="174.2" text-anchor="middle" font-size="12" font-weight="normal">ngắt DMA: hết kênh</text><polyline points="935,250 935,350 155,350 155,250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="545" y="376.55" text-anchor="middle" font-size="13" font-weight="normal">vòng chính thu kết quả (bus_collect)</text><polyline points="545,160 545,110 155,110 155,160" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="350" y="104.2" text-anchor="middle" font-size="12" font-weight="normal">quá 10 ms không có ngắt: hủy chu kỳ, đếm quá hạn</text><text x="1250" y="45.6" text-anchor="middle" font-size="16" font-weight="bold">Độ tươi dữ liệu của mỗi INA</text><rect x="1130" y="160" width="300" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1280" y="195.6" text-anchor="middle" font-size="16" font-weight="bold">TƯƠI</text><text x="1280" y="228.55" text-anchor="middle" font-size="13" font-weight="normal">nhãn thời gian &lt; 500 ms</text><rect x="1130" y="420" width="300" height="90" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1280" y="455.6" text-anchor="middle" font-size="16" font-weight="bold">CŨ</text><text x="1280" y="488.55" text-anchor="middle" font-size="13" font-weight="normal">quá 500 ms không cập nhật</text><polyline points="1215,250 1215,420" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1200" y="344.2" text-anchor="end" font-size="12" font-weight="normal">quá 500 ms</text><polyline points="1345,420 1345,250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1360" y="344.2" text-anchor="start" font-size="12" font-weight="normal">đọc thành công 1 chu kỳ</text><text x="1280" y="536.2" text-anchor="middle" font-size="12" font-weight="normal">Cụm &#x27;TƯƠI&#x27; dùng cho bản tin giám sát (fresh_mask)</text><text x="1280" y="552.2" text-anchor="middle" font-size="12" font-weight="normal">và điều kiện tự xác nhận ứng dụng mới</text></svg>