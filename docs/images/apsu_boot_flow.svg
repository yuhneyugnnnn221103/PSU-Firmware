<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1120" viewBox="0 0 1250 1120" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="200.0" y="20" width="440" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="420.0" y="50.25" text-anchor="middle" font-size="15" font-weight="bold">Reset / cấp nguồn</text><rect x="200.0" y="105" width="440" height="62" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="131.9" text-anchor="middle" font-size="14" font-weight="normal">Khởi tạo: clock, GPIO, UART, IWDG (8 s)</text><text x="420.0" y="149.9" text-anchor="middle" font-size="14" font-weight="normal">đọc vùng cấu hình (chọn bank hợp lệ)</text><polyline points="420,70 420,105" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="420,167 420,215" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="420,215.0 680.0,290 420,365.0 160.0,290" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420" y="267.9" text-anchor="middle" font-size="14" font-weight="normal">Ảnh ứng dụng khởi động được?</text><text x="420" y="285.9" text-anchor="middle" font-size="14" font-weight="normal">CRC32 + vectơ hợp lệ,</text><text x="420" y="303.9" text-anchor="middle" font-size="14" font-weight="normal">chưa bị yêu cầu vào recovery,</text><text x="420" y="321.9" text-anchor="middle" font-size="14" font-weight="normal">còn lượt thử (&lt; 3 hoặc đã xác nhận)</text><rect x="900" y="255" width="300" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1050.0" y="285.75" text-anchor="middle" font-size="15" font-weight="bold">Recovery vĩnh viễn</text><text x="1050.0" y="304.75" text-anchor="middle" font-size="15" font-weight="bold">(LED nhấp 50 ms, nhận lệnh nạp)</text><polyline points="680,290 900,290" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="790" y="274.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><polyline points="420,365 420,425" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="434" y="402.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><rect x="200.0" y="425" width="440" height="62" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="451.9" text-anchor="middle" font-size="14" font-weight="normal">Nghe UART trong 300 ms</text><text x="420.0" y="469.9" text-anchor="middle" font-size="14" font-weight="normal">(cửa sổ recovery)</text><polyline points="420,487 420,535" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="420,540.0 650.0,605 420,670.0 190.0,605" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420" y="600.9" text-anchor="middle" font-size="14" font-weight="normal">Nhận được khung hợp lệ</text><text x="420" y="618.9" text-anchor="middle" font-size="14" font-weight="normal">gửi tới PSU này?</text><polyline points="650,605 1050,605 1050,325" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="850" y="589.55" text-anchor="middle" font-size="13" font-weight="normal">Có (thường là INFO)</text><polyline points="420,670 420,725" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="434" y="706.55" text-anchor="start" font-size="13" font-weight="normal">Không</text><rect x="200.0" y="725" width="440" height="62" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="751.9" text-anchor="middle" font-size="14" font-weight="normal">Tăng bộ đếm khởi động thử (boot_count)</text><text x="420.0" y="769.9" text-anchor="middle" font-size="14" font-weight="normal">nếu ảnh chưa xác nhận</text><polyline points="420,787 420,835" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="200.0" y="835" width="440" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="420.0" y="865.9" text-anchor="middle" font-size="14" font-weight="normal">Tắt ngắt, SysTick; đặt VTOR, MSP</text><text x="420.0" y="883.9" text-anchor="middle" font-size="14" font-weight="normal">rồi nhảy vào ứng dụng</text><polyline points="420,905 420,945" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="200.0" y="945" width="440" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="420.0" y="975.25" text-anchor="middle" font-size="15" font-weight="bold">Ứng dụng chạy</text></svg>