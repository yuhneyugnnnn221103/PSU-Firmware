<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="990" viewBox="0 0 1300 990" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="560" y="30" width="420" height="50" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="770.0" y="60.25" text-anchor="middle" font-size="15" font-weight="bold">Khởi tạo (sau reset: mọi cụm tắt)</text><rect x="560" y="114" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="153.9" text-anchor="middle" font-size="14" font-weight="normal">Đọc thời gian hệ thống, xử lý bus I2C</text><polyline points="770.0,184 770.0,218" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="218" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="248.9" text-anchor="middle" font-size="14" font-weight="normal">Mỗi 10 ms: đọc trạng thái FT của DCM,</text><text x="770.0" y="266.9" text-anchor="middle" font-size="14" font-weight="normal">giám sát truyền (Comm_TxWatchdog)</text><polyline points="770.0,288 770.0,322" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="322" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="361.9" text-anchor="middle" font-size="14" font-weight="normal">Mỗi 60 ms: bắt đầu quét 4 INA228 (I2C DMA)</text><polyline points="770.0,392 770.0,426" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="426" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="456.9" text-anchor="middle" font-size="14" font-weight="normal">Nhận và xử lý bản tin từ ACTL</text><text x="770.0" y="474.9" text-anchor="middle" font-size="14" font-weight="normal">(kiểm khung, CRC16, thi hành lệnh)</text><polyline points="770.0,496 770.0,530" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="530" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="560.9" text-anchor="middle" font-size="14" font-weight="normal">Thu kết quả quét INA, xử lý ALERT,</text><text x="770.0" y="578.9" text-anchor="middle" font-size="14" font-weight="normal">nạp cấu hình mới, đồng bộ ngưỡng</text><polyline points="770.0,600 770.0,634" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="634" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="664.9" text-anchor="middle" font-size="14" font-weight="normal">Máy trạng thái an toàn của 4 cụm:</text><text x="770.0" y="682.9" text-anchor="middle" font-size="14" font-weight="normal">so ngưỡng, bật/tắt EN, ghi mã trip</text><polyline points="770.0,704 770.0,738" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="738" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="768.9" text-anchor="middle" font-size="14" font-weight="normal">Tác vụ vào recovery, LED, tự xác nhận</text><text x="770.0" y="786.9" text-anchor="middle" font-size="14" font-weight="normal">ứng dụng mới (10 s)</text><polyline points="770.0,808 770.0,842" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="560" y="842" width="420" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="881.9" text-anchor="middle" font-size="14" font-weight="normal">Báo watchdog (IWDG 8 s)</text><polyline points="770.0,80 770.0,114" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="980,877.0 1040,877.0 1040,149.0 980,149.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1050" y="517.55" text-anchor="start" font-size="13" font-weight="normal">Lặp lại</text><rect x="40" y="416.0" width="330" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="205.0" y="447.9" text-anchor="middle" font-size="14" font-weight="normal">Ngắt UART/DMA:</text><text x="205.0" y="465.9" text-anchor="middle" font-size="14" font-weight="normal">nhận byte vào bộ đệm</text><text x="205.0" y="483.9" text-anchor="middle" font-size="14" font-weight="normal">(mỗi cổng RS422, FT232)</text><polyline points="370,461.0 560,461.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"  stroke-dasharray="6 4"/><rect x="40" y="520.0" width="330" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="205.0" y="560.9" text-anchor="middle" font-size="14" font-weight="normal">Ngắt I2C DMA:</text><text x="205.0" y="578.9" text-anchor="middle" font-size="14" font-weight="normal">hoàn tất đọc INA228</text><polyline points="370,565.0 560,565.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"  stroke-dasharray="6 4"/><rect x="40" y="624.0" width="330" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="205.0" y="655.9" text-anchor="middle" font-size="14" font-weight="normal">Ngắt EXTI: ALERT của INA228</text><text x="205.0" y="673.9" text-anchor="middle" font-size="14" font-weight="normal">cắt EN ngay (khoảng 2 µs),</text><text x="205.0" y="691.9" text-anchor="middle" font-size="14" font-weight="normal">đặt cờ fast_trip</text><polyline points="370,669.0 560,669.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"  stroke-dasharray="6 4"/><text x="205" y="385.9" text-anchor="middle" font-size="14" font-weight="bold">Ngắt (chạy bất đồng bộ)</text></svg>