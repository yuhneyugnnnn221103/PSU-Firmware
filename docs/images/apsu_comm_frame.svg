<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="60" y="70" width="100" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="110.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">AB CD</text><text x="110.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">(header)</text><text x="110.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte 0 .. 1</text><rect x="160" y="70" width="100" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="210.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">CMD</text><text x="210.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">(2 byte)</text><text x="210.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte 2 .. 3</text><rect x="260" y="70" width="80" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="300.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">ADDR</text><text x="300.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">(1 byte)</text><text x="300.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte 4</text><rect x="340" y="70" width="470" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="575.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">Dữ liệu (payload)</text><text x="575.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">đúng độ dài theo CMD</text><text x="575.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte 5 .. N-5</text><rect x="810" y="70" width="110" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="865.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">CRC16</text><text x="865.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">(2 byte, BE)</text><text x="865.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte N-4 .. N-3</text><rect x="920" y="70" width="100" height="80" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="970.0" y="106.05" text-anchor="middle" font-size="13" font-weight="bold">E1 E2</text><text x="970.0" y="123.05" text-anchor="middle" font-size="13" font-weight="bold">(đuôi)</text><text x="970.0" y="179.2" text-anchor="middle" font-size="12" font-weight="normal">byte N-2 .. N-1</text><text x="700" y="45.25" text-anchor="middle" font-size="15" font-weight="bold">Cấu trúc khung bản tin APSU (đánh số byte từ 0, N = tổng độ dài khung)</text><polyline points="260,205 260,225 810,225 810,205" fill="none" stroke="#000" stroke-width="1.5"/><text x="535.0" y="254.55" text-anchor="middle" font-size="13" font-weight="normal">Phạm vi tính CRC16-CCITT-FALSE (đa thức 0x1021, khởi tạo 0xFFFF): từ ADDR đến hết payload</text><text x="700" y="294.55" text-anchor="middle" font-size="13" font-weight="normal">Số nhiều byte theo thứ tự big-endian. Độ dài N xác định bởi CMD (ví dụ 13, 17, 269, 310, 915 byte).</text></svg>