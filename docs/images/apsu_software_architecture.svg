al">Lưu/đọc cấu hình</text><text x="1364.0" y="345.0" text-anchor="middle" font-size="15" font-weight="normal">trong Flash</text><line x1="1247.0" y1="436.0" x2="1259.0" y2="436.0" stroke="#000" stroke-width="1.5"/><rect x="1259.0" y="396" width="210" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1364.0" y="441.0" text-anchor="middle" font-size="15" font-weight="normal">Quản lý phiên bản</text><line x1="1247.0" y1="542.0" x2="1259.0" y2="542.0" stroke="#000" stroke-width="1.5"/><rect x="1259.0" y="502" width="210" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="1364.0" y="537.0" text-anchor="middle" font-size="15" font-weight="normal">Bootloader: nạp phần mềm,</text><text x="1364.0" y="557.0" text-anchor="middle" font-size="15" font-weight="normal">chế độ recovery</text><rect x="100.0" y="618" width="1300" height="50" fill="#fff" stroke="#000" stroke-width="1.5" stroke-dasharray="8 5"/><text x="750.0" y="648.0" text-anchor="middle" font-size="15" font-weight="normal">Khối chỉ thị và chẩn đoán dùng chung: LED trạng thái, bộ đếm lỗi truyền thông, thời gian hoạt động</text></svg>