<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1400" viewBox="0 0 1350 1400" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="400" cy="28" r="16" fill="#000" stroke="#000" stroke-width="1.6"/><polyline points="400,44 400,70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="160.0" y="70" width="480" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="95.9" text-anchor="middle" font-size="14" font-weight="normal">Khởi động: PsuCfg_Load đọc blob cấu hình</text><text x="400.0" y="113.9" text-anchor="middle" font-size="14" font-weight="normal">đã lưu trong Flash</text><polyline points="400,130 400,165" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="400,165.0 600.0,215 400,265.0 200.0,215" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="219.9" text-anchor="middle" font-size="14" font-weight="normal">Có blob hợp lệ, đủ 904 byte?</text><polyline points="600,215 800,215" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="660" y="204.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="800" y="180" width="380" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="211.05" text-anchor="middle" font-size="13" font-weight="normal">Dựng cấu hình mặc định (thanh ghi INA</text><text x="990.0" y="228.05" text-anchor="middle" font-size="13" font-weight="normal">mặc định, ngưỡng tắt)</text><polyline points="400,265 400,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="302.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><polyline points="990,250 990,360 640.0,360" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="160.0" y="330" width="480" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="364.9" text-anchor="middle" font-size="14" font-weight="normal">Áp ngưỡng bảo vệ cho 4 cụm, chờ lệnh</text><rect x="800" y="70" width="380" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="101.05" text-anchor="middle" font-size="13" font-weight="normal">Hỏi cấu hình 03 03: trả bản sao cấu hình</text><text x="990.0" y="118.05" text-anchor="middle" font-size="13" font-weight="normal">đang dùng trong RAM bằng bản tin 82 82</text><polyline points="400,390 400,450" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="160.0" y="450" width="480" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="475.9" text-anchor="middle" font-size="14" font-weight="normal">Nhận lệnh ghi cấu hình 04 04</text><text x="400.0" y="493.9" text-anchor="middle" font-size="14" font-weight="normal">(915 byte, bỏ 2 byte Mask, lấy 904 byte)</text><polyline points="400,510 400,550" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="400,550.0 570.0,600 400,650.0 230.0,600" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="604.9" text-anchor="middle" font-size="14" font-weight="normal">Mọi cụm đang OFF?</text><polyline points="570,600 800,600" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="630" y="589.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="800" y="570" width="380" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="596.05" text-anchor="middle" font-size="13" font-weight="normal">Từ chối, kết quả = 1 (chưa OFF);</text><text x="990.0" y="613.05" text-anchor="middle" font-size="13" font-weight="normal">cấu hình cũ giữ nguyên</text><polyline points="400,650 400,690" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="682.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><polygon points="400,690.0 580.0,740 400,790.0 220.0,740" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="744.9" text-anchor="middle" font-size="14" font-weight="normal">Bank đang ghi còn đủ chỗ?</text><polyline points="580,740 800,740" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="640" y="729.55" text-anchor="middle" font-size="13" font-weight="normal">Hết chỗ</text><rect x="800" y="700" width="380" height="90" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="732.55" text-anchor="middle" font-size="13" font-weight="normal">Nén (compaction): xóa bank kia, chép</text><text x="990.0" y="749.55" text-anchor="middle" font-size="13" font-weight="normal">snapshot, ghi COMMIT cuối cùng</text><text x="990.0" y="766.55" text-anchor="middle" font-size="13" font-weight="normal">(xóa sector chặn CPU vài trăm ms)</text><polyline points="400,790 400,810" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="809.55" text-anchor="start" font-size="13" font-weight="normal">Còn</text><rect x="160.0" y="810" width="480" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="835.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi 21 bản ghi mảnh 44 byte, rồi bản ghi</text><text x="400.0" y="853.9" text-anchor="middle" font-size="14" font-weight="normal">chốt (độ dài và CRC32 của cả blob)</text><polyline points="990,790 990,840 640.0,840" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polyline points="400,870 400,910" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="400,910.0 570.0,960 400,1010.0 230.0,960" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400" y="964.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi thành công?</text><polyline points="570,960 800,960" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="630" y="949.55" text-anchor="middle" font-size="13" font-weight="normal">Lỗi</text><rect x="800" y="930" width="380" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="990.0" y="956.05" text-anchor="middle" font-size="13" font-weight="normal">Kết quả = 3 (lỗi Flash);</text><text x="990.0" y="973.05" text-anchor="middle" font-size="13" font-weight="normal">bản cấu hình cũ vẫn còn nguyên</text><polyline points="400,1010 400,1050" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="410" y="1042.55" text-anchor="start" font-size="13" font-weight="normal">Được</text><rect x="160.0" y="1050" width="480" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="1080.9" text-anchor="middle" font-size="14" font-weight="normal">Cập nhật bản sao RAM, áp ngưỡng bảo vệ</text><text x="400.0" y="1098.9" text-anchor="middle" font-size="14" font-weight="normal">ngay, đặt cờ cấu hình mới</text><polyline points="400,1120 400,1160" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="160.0" y="1160" width="480" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="1190.9" text-anchor="middle" font-size="14" font-weight="normal">Vòng chính nạp lại 9 thanh ghi và khởi tạo</text><text x="400.0" y="1208.9" text-anchor="middle" font-size="14" font-weight="normal">lại INA228 theo cấu hình mới</text><polyline points="400,1230 400,1270" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="160.0" y="1270" width="480" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="400.0" y="1300.9" text-anchor="middle" font-size="14" font-weight="normal">Ghi kết quả (0 đúng, 1 chưa OFF, 3 lỗi Flash)</text><text x="400.0" y="1318.9" text-anchor="middle" font-size="14" font-weight="normal">vào bản tin giám sát; không có ACK</text><polyline points="1180,600 1260,600 1260,1305 640,1305" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1180,960 1260,960" fill="none" stroke="#000" stroke-width="1.5"/><polyline points="400,1340 400,1370" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="400" cy="1386" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><circle cx="400" cy="1386" r="9" fill="#000"/></svg>