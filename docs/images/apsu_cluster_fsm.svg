<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="60" y="200" width="180" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="150.0" y="240.25" text-anchor="middle" font-size="15" font-weight="bold">BOOT</text><rect x="360" y="200" width="180" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="450.0" y="240.25" text-anchor="middle" font-size="15" font-weight="bold">OFF</text><rect x="680" y="200" width="180" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="240.25" text-anchor="middle" font-size="15" font-weight="bold">ARMING</text><rect x="1000" y="200" width="180" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1090.0" y="240.25" text-anchor="middle" font-size="15" font-weight="bold">ON</text><rect x="680" y="430" width="180" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="770.0" y="470.25" text-anchor="middle" font-size="15" font-weight="bold">TRIPPED</text><polyline points="240,235 360,235" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="300" y="219.55" text-anchor="middle" font-size="13" font-weight="normal">sau 500 ms</text><polyline points="540,235 680,235" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="610" y="183.2" text-anchor="middle" font-size="12" font-weight="normal">có lệnh bật,</text><text x="610" y="199.2" text-anchor="middle" font-size="12" font-weight="normal">đã OFF ≥ 100 ms</text><text x="610" y="215.2" text-anchor="middle" font-size="12" font-weight="normal">→ bật EN</text><polyline points="860,235 1000,235" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="930" y="209.2" text-anchor="middle" font-size="12" font-weight="normal">sau 400 ms,</text><text x="930" y="225.2" text-anchor="middle" font-size="12" font-weight="normal">không lỗi</text><polyline points="1090,200 1090,90 450,90 450,200" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="770" y="79.55" text-anchor="middle" font-size="13" font-weight="normal">lệnh tắt (tắt EN)</text><polyline points="770,200 770,135 450,135" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="620" y="156.55" text-anchor="middle" font-size="13" font-weight="normal">lệnh tắt</text><polyline points="770,270 770,430" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="780" y="346.05" text-anchor="start" font-size="13" font-weight="normal">FT của DCM hoặc</text><text x="780" y="363.05" text-anchor="start" font-size="13" font-weight="normal">ALERT: cắt EN</text><polyline points="1090,270 1090,465 860,465" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1100" y="376.05" text-anchor="start" font-size="13" font-weight="normal">vượt ngưỡng, ALERT,</text><text x="1100" y="393.05" text-anchor="start" font-size="13" font-weight="normal">FT: cắt EN</text><polyline points="680,465 450,465 450,270" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="565" y="489.55" text-anchor="middle" font-size="13" font-weight="normal">ClearTrip (xóa lỗi toàn PSU)</text><text x="150" y="326.05" text-anchor="middle" font-size="13" font-weight="normal">Reset</text><text x="150" y="343.05" text-anchor="middle" font-size="13" font-weight="normal">(mọi cụm tắt)</text><polyline points="150,290 150,270" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /></svg>