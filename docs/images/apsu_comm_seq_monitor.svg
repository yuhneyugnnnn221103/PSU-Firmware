<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="35.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="130.0" y="48.55" text-anchor="middle" font-size="13" font-weight="bold">ACTL</text><line x1="130.0" y1="72" x2="130.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="283.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="378.0" y="40.05" text-anchor="middle" font-size="13" font-weight="bold">UART + DMA</text><text x="378.0" y="57.05" text-anchor="middle" font-size="13" font-weight="bold">(RS422 / FT232)</text><line x1="378.0" y1="72" x2="378.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="531.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="626.0" y="40.05" text-anchor="middle" font-size="13" font-weight="bold">Comm</text><text x="626.0" y="57.05" text-anchor="middle" font-size="13" font-weight="bold">(xử lý bản tin)</text><line x1="626.0" y1="72" x2="626.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="779.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="874.0" y="40.05" text-anchor="middle" font-size="13" font-weight="bold">Khối an toàn</text><text x="874.0" y="57.05" text-anchor="middle" font-size="13" font-weight="bold">và mã trip</text><line x1="874.0" y1="72" x2="874.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="1027.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1122.0" y="40.05" text-anchor="middle" font-size="13" font-weight="bold">Dữ liệu đo</text><text x="1122.0" y="57.05" text-anchor="middle" font-size="13" font-weight="bold">(INA228)</text><line x1="1122.0" y1="72" x2="1122.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="1275.0" y="16" width="190" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1370.0" y="48.55" text-anchor="middle" font-size="13" font-weight="bold">PsuMon_Build</text><line x1="1370.0" y1="72" x2="1370.0" y2="740" stroke="#000" stroke-width="1.2" stroke-dasharray="7 5"/><line x1="130.0" y1="110" x2="378.0" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="254.0" y="101" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">1. Khung 02 02 hỏi giám sát (13 byte)</text><polyline points="378.0,168 438.0,168 438.0,194 378.0,194" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="448.0" y="185.55" text-anchor="start" font-size="13" font-weight="normal">2. DMA ghi byte vào bộ đệm vòng</text><line x1="626.0" y1="224" x2="378.0" y2="224" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="502.0" y="215" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">3. Comm_RxPoll: đọc vị trí ghi (head)</text><polyline points="626.0,282 686.0,282 686.0,308 626.0,308" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="696.0" y="299.55" text-anchor="start" font-size="13" font-weight="normal">4. Psu_RxFeed tách khung; kiểm tra CRC16, địa chỉ</text><line x1="626.0" y1="338" x2="1122.0" y2="338" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="874.0" y="329" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">5. Đọc dòng, nhiệt độ, độ tươi dữ liệu</text><line x1="626.0" y1="396" x2="874.0" y2="396" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="750.0" y="387" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">6. Đọc trạng thái cụm, số lần trip, mã trip</text><line x1="626.0" y1="454" x2="1370.0" y2="454" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="998.0" y="445" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">7. PsuMon_Build: ghép 310 byte, tính CRC16</text><line x1="626.0" y1="512" x2="378.0" y2="512" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="502.0" y="503" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">8. tx_start: DE = 1, phát bằng DMA</text><line x1="378.0" y1="570" x2="130.0" y2="570" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="254.0" y="561" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">9. Khung 81 81 giám sát (310 byte)</text><line x1="378.0" y1="628" x2="626.0" y2="628" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="502.0" y="619" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">10. TxCplt: DE = 0, giải phóng cổng</text></svg>