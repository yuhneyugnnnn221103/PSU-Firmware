<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1070" viewBox="0 0 1700 1070" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><circle cx="360" cy="28" r="16" fill="#000" stroke="#000" stroke-width="1.6"/><polyline points="360,44 360,72" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="140" y="72" width="440" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="95.9" text-anchor="middle" font-size="14" font-weight="normal">DMA ghi byte vào bộ đệm vòng</text><text x="360.0" y="113.9" text-anchor="middle" font-size="14" font-weight="normal">2048 byte (mỗi cổng)</text><polyline points="360,128 360,168" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="140" y="168" width="440" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="191.9" text-anchor="middle" font-size="14" font-weight="normal">Comm_RxPoll (vòng chính): đọc</text><text x="360.0" y="209.9" text-anchor="middle" font-size="14" font-weight="normal">vị trí ghi của DMA</text><polyline points="360,224 360,250" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,250.0 510.0,300 360,350.0 210.0,300" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="304.9" text-anchor="middle" font-size="14" font-weight="normal">Có byte mới?</text><polyline points="510,300 640,300" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="580.0" y="289.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="640" y="265" width="300" height="70" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="296.05" text-anchor="middle" font-size="13" font-weight="normal">Im lặng &gt; 200 ms giữa khung: hủy</text><text x="790.0" y="313.05" text-anchor="middle" font-size="13" font-weight="normal">khung dở. Quay lại vòng chính</text><polyline points="360,350 360,392" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="379.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><rect x="140" y="392" width="440" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="422.9" text-anchor="middle" font-size="14" font-weight="normal">Đưa từng byte vào bộ tách khung Psu_RxFeed</text><text x="360.0" y="440.9" text-anchor="middle" font-size="14" font-weight="normal">(AB CD, CMD, độ dài theo CMD, E1 E2)</text><polyline points="360,462 360,490" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="360,490.0 510.0,540 360,590.0 210.0,540" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="544.9" text-anchor="middle" font-size="14" font-weight="normal">Đủ một khung?</text><polyline points="510,540 640,540" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="580.0" y="529.55" text-anchor="middle" font-size="13" font-weight="normal">Chưa</text><rect x="640" y="510" width="300" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="544.55" text-anchor="middle" font-size="13" font-weight="normal">Chờ byte tiếp theo</text><polyline points="360,590 360,632" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="619.55" text-anchor="start" font-size="13" font-weight="normal">Đủ</text><polygon points="360,632.0 530.0,682 360,732.0 190.0,682" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="686.9" text-anchor="middle" font-size="14" font-weight="normal">CRC16 và đuôi E1 E2 đúng?</text><polyline points="530,682 640,682" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="585.0" y="671.55" text-anchor="middle" font-size="13" font-weight="normal">Sai</text><rect x="640" y="652" width="300" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="686.55" text-anchor="middle" font-size="13" font-weight="normal">rx_badcrc++, bỏ khung</text><polyline points="360,732 360,772" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="761.55" text-anchor="start" font-size="13" font-weight="normal">Đúng</text><polygon points="360,772.0 530.0,822 360,872.0 190.0,822" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="826.9" text-anchor="middle" font-size="14" font-weight="normal">Địa chỉ trùng địa chỉ PSU?</text><polyline points="530,822 640,822" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="585.0" y="811.55" text-anchor="middle" font-size="13" font-weight="normal">Sai</text><rect x="640" y="792" width="300" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="826.55" text-anchor="middle" font-size="13" font-weight="normal">rx_badaddr++, bỏ khung</text><polyline points="360,872 360,900" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="370" y="896.55" text-anchor="start" font-size="13" font-weight="normal">Đúng</text><rect x="140" y="900" width="440" height="60" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360.0" y="925.9" text-anchor="middle" font-size="14" font-weight="normal">rx_frames++, ghi thời điểm nhận</text><text x="360.0" y="943.9" text-anchor="middle" font-size="14" font-weight="normal">(dùng cho kiểm tra liên kết)</text><polyline points="360,960 360,984" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="360" cy="1000" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="360" y="1004.55" text-anchor="middle" font-size="13" font-weight="bold">A</text><circle cx="1310" cy="178" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310" y="182.55" text-anchor="middle" font-size="13" font-weight="bold">A</text><polyline points="1310,194 1310,222" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="1080" y="222" width="460" height="150" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310.0" y="259.05" text-anchor="middle" font-size="13" font-weight="normal">Chọn xử lý theo mã lệnh (CMD):</text><text x="1310.0" y="276.05" text-anchor="middle" font-size="13" font-weight="normal">01 01: điều khiển cấp nguồn, ghi kết quả</text><text x="1310.0" y="293.05" text-anchor="middle" font-size="13" font-weight="normal">02 02: lập bản tin giám sát 81 81</text><text x="1310.0" y="310.05" text-anchor="middle" font-size="13" font-weight="normal">03 03: trả cấu hình 82 82; 04 04: ghi cấu hình</text><text x="1310.0" y="327.05" text-anchor="middle" font-size="13" font-weight="normal">95 95, 99 99, 98 98: INFO, phiên bản, vào recovery</text><text x="1310.0" y="344.05" text-anchor="middle" font-size="13" font-weight="normal">90 90 đến 93 93, 96 96, 9A 9A: ACK mã 12</text><polyline points="1310,372 1310,412" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><polygon points="1310,412.0 1460.0,462 1310,512.0 1160.0,462" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310" y="466.9" text-anchor="middle" font-size="14" font-weight="normal">Lệnh cần trả lời?</text><polyline points="1160,462 920,462" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1100" y="451.55" text-anchor="middle" font-size="13" font-weight="normal">Không</text><rect x="660" y="422" width="260" height="80" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="449.55" text-anchor="middle" font-size="13" font-weight="normal">Kết thúc. 01 01, 04 04 không ACK:</text><text x="790.0" y="466.55" text-anchor="middle" font-size="13" font-weight="normal">kết quả ghi trong bản tin</text><text x="790.0" y="483.55" text-anchor="middle" font-size="13" font-weight="normal">giám sát</text><polyline points="1310,512 1310,552" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1320" y="541.55" text-anchor="start" font-size="13" font-weight="normal">Có</text><polygon points="1310,552.0 1460.0,602 1310,652.0 1160.0,602" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310" y="606.9" text-anchor="middle" font-size="14" font-weight="normal">Cổng phát rảnh?</text><polyline points="1160,602 920,602" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1100" y="591.55" text-anchor="middle" font-size="13" font-weight="normal">Bận</text><rect x="660" y="572" width="260" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="790.0" y="598.05" text-anchor="middle" font-size="13" font-weight="normal">tx_skipped++, bỏ trả lời</text><text x="790.0" y="615.05" text-anchor="middle" font-size="13" font-weight="normal">(PC hỏi lại)</text><polyline points="1310,652 1310,702" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1320" y="687.55" text-anchor="start" font-size="13" font-weight="normal">Rảnh</text><rect x="1080" y="702" width="460" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310.0" y="732.9" text-anchor="middle" font-size="14" font-weight="normal">Lập khung (Psu_FrameBegin), điền dữ liệu,</text><text x="1310.0" y="750.9" text-anchor="middle" font-size="14" font-weight="normal">tính CRC16 (Psu_FrameSeal)</text><polyline points="1310,772 1310,802" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="1080" y="802" width="460" height="70" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310.0" y="832.9" text-anchor="middle" font-size="14" font-weight="normal">Bật DE (RS422), đặt busy,</text><text x="1310.0" y="850.9" text-anchor="middle" font-size="14" font-weight="normal">phát bằng UART DMA</text><polyline points="1310,872 1310,902" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="1080" y="902" width="460" height="80" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1310.0" y="928.9" text-anchor="middle" font-size="14" font-weight="normal">Ngắt TxCplt: tắt DE, giải phóng cổng.</text><text x="1310.0" y="946.9" text-anchor="middle" font-size="14" font-weight="normal">Quá hạn: Comm_TxWatchdog hủy,</text><text x="1310.0" y="964.9" text-anchor="middle" font-size="14" font-weight="normal">tx_stuck++</text><polyline points="1310,982 1310,1018" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><circle cx="1310" cy="1034" r="16" fill="#fff" stroke="#000" stroke-width="1.6"/><circle cx="1310" cy="1034" r="9" fill="#000"/></svg>