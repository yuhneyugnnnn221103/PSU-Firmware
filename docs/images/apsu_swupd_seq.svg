oke-width="5" paint-order="stroke">1. INFO (95 95)</text><line x1="543.3333333333333" y1="168" x2="130.0" y2="168" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="336.66666666666663" y="159" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">2. ACK: vị trí A, trạng thái xác nhận</text><line x1="130.0" y1="226" x2="543.3333333333333" y2="226" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="336.66666666666663" y="217" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">3. GET_VERSION (99 99)</text><line x1="543.3333333333333" y1="284" x2="130.0" y2="284" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="336.66666666666663" y="275" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">4. Phiên bản (A9 A9)</text><line x1="130.0" y1="342" x2="543.3333333333333" y2="342" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="336.66666666666663" y="333" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">5. ENTER_REC (98 98)</text><polyline points="543.3333333333333,400 603.3333333333333,400 603.3333333333333,426 543.3333333333333,426" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="613.3333333333333" y="417.55" text-anchor="start" font-size="13" font-weight="normal">6. Kiểm tra mọi cụm OFF</text><line x1="543.3333333333333" y1="456" x2="1370.0" y2="456" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="956.6666666666666" y="447" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">7. Ghi boot record: FORCE_FAIL</text><line x1="543.3333333333333" y1="514" x2="130.0" y2="514" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="336.66666666666663" y="505" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">8. ACK (rồi reset sau khoảng 50 ms)</text><line x1="543.3333333333333" y1="572" x2="956.6666666666666" y2="572" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="750.0" y="563" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">9. Reset: bootloader khởi động</text><line x1="956.6666666666666" y1="630" x2="1370.0" y2="630" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1163.3333333333333" y="621" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">10. Đọc boot record: FORCE_FAIL, ở lại recovery</text><line x1="130.0" y1="688" x2="956.6666666666666" y2="688" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="679" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">11. INFO</text><line x1="956.6666666666666" y1="746" x2="130.0" y2="746" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="737" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">12. ACK: vị trí R</text><line x1="130.0" y1="804" x2="956.6666666666666" y2="804" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="795" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">13. ERASE (96 96)</text><line x1="956.6666666666666" y1="862" x2="1370.0" y2="862" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1163.3333333333333" y="853" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">14. Xóa 5 sector vùng ứng dụng</text><line x1="956.6666666666666" y1="920" x2="130.0" y2="920" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="911" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">15. ACK khi xóa xong</text><line x1="130.0" y1="978" x2="956.6666666666666" y2="978" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="969" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">16. BEGIN: kích thước, CRC32 của file</text><line x1="956.6666666666666" y1="1036" x2="130.0" y2="1036" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="1027" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">17. ACK</text><line x1="130.0" y1="1094" x2="956.6666666666666" y2="1094" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="1085" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">18. SET_VERSION: tên file bin</text><line x1="956.6666666666666" y1="1152" x2="130.0" y2="1152" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="1143" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">19. ACK</text><line x1="130.0" y1="1210" x2="956.6666666666666" y2="1210" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="1201" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">20. DATA seq n (256 byte), lặp đến hết file</text><line x1="956.6666666666666" y1="1268" x2="1370.0" y2="1268" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1163.3333333333333" y="1259" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">21. Ghi chunk rồi đọc lại so sánh</text><line x1="956.6666666666666" y1="1326" x2="130.0" y2="1326" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="1317" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">22. ACK seq n</text><line x1="130.0" y1="1384" x2="956.6666666666666" y2="1384" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="1375" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">23. END</text><line x1="956.6666666666666" y1="1442" x2="1370.0" y2="1442" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1163.3333333333333" y="1433" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">24. Kiểm CRC32, ghi header, ghi boot record (0, chưa xác nhận)</text><line x1="956.6666666666666" y1="1500" x2="130.0" y2="1500" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="1491" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">25. ACK</text><line x1="130.0" y1="1558" x2="956.6666666666666" y2="1558" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="543.3333333333333" y="1549" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">26. COMMIT</text><line x1="956.6666666666666" y1="1616" x2="130.0" y2="1616" stroke="#000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="543.3333333333333" y="1607" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">27. ACK</text><polyline points="956.6666666666666,1674 1016.6666666666666,1674 1016.6666666666666,1700 956.6666666666666,1700" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="1026.6666666666665" y="1691.55" text-anchor="start" font-size="13" font-weight="normal">28. Reset</text><line x1="956.6666666666666" y1="1730" x2="1370.0" y2="1730" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="1163.3333333333333" y="1721" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">29. Chọn ảnh hợp lệ, tăng boot_count</text><line x1="956.6666666666666" y1="1788" x2="543.3333333333333" y2="1788" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="750.0" y="1779" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">30. Nhảy vào ứng dụng mới</text><polyline points="543.3333333333333,1846 603.3333333333333,1846 603.3333333333333,1872 543.3333333333333,1872" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="613.3333333333333" y="1863.55" text-anchor="start" font-size="13" font-weight="normal">31. Sau 10 s ổn định: tự xác nhận</text><line x1="543.3333333333333" y1="1902" x2="1370.0" y2="1902" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/><text x="956.6666666666666" y="1893" text-anchor="middle" font-size="13" stroke="#fff" stroke-width="5" paint-order="stroke">32. Ghi boot record: đã xác nhận</text></svg>