<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" font-family="'Times New Roman','Liberation Serif','DejaVu Serif',serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="40" y="230" width="250" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="165.0" y="265.6" text-anchor="middle" font-size="16" font-weight="bold">BOOT</text><text x="165.0" y="294.05" text-anchor="middle" font-size="13" font-weight="normal">EN = 0</text><text x="165.0" y="311.05" text-anchor="middle" font-size="13" font-weight="normal">bỏ qua mọi ALERT</text><rect x="400" y="230" width="250" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="525.0" y="265.6" text-anchor="middle" font-size="16" font-weight="bold">OFF</text><text x="525.0" y="294.05" text-anchor="middle" font-size="13" font-weight="normal">EN = 0</text><text x="525.0" y="311.05" text-anchor="middle" font-size="13" font-weight="normal">chờ yêu cầu bật</text><rect x="760" y="230" width="250" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="885.0" y="265.6" text-anchor="middle" font-size="16" font-weight="bold">ARMING</text><text x="885.0" y="294.05" text-anchor="middle" font-size="13" font-weight="normal">EN = 1</text><text x="885.0" y="311.05" text-anchor="middle" font-size="13" font-weight="normal">chỉ cắt khi FT/ALERT</text><rect x="1120" y="230" width="250" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="1245.0" y="265.6" text-anchor="middle" font-size="16" font-weight="bold">ON</text><text x="1245.0" y="294.05" text-anchor="middle" font-size="13" font-weight="normal">EN = 1</text><text x="1245.0" y="311.05" text-anchor="middle" font-size="13" font-weight="normal">giám sát đầy đủ</text><rect x="760" y="500" width="250" height="100" rx="14" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="885.0" y="535.6" text-anchor="middle" font-size="16" font-weight="bold">TRIPPED</text><text x="885.0" y="564.05" text-anchor="middle" font-size="13" font-weight="normal">EN = 0</text><text x="885.0" y="581.05" text-anchor="middle" font-size="13" font-weight="normal">giữ mã trip</text><polyline points="290,280 400,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="345" y="234.2" text-anchor="middle" font-size="12" font-weight="normal">sau 500 ms</text><text x="345" y="250.2" text-anchor="middle" font-size="12" font-weight="normal">(INA228 đo xong)</text><polyline points="650,280 760,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="705" y="205.2" text-anchor="middle" font-size="12" font-weight="normal">có yêu cầu bật,</text><text x="705" y="221.2" text-anchor="middle" font-size="12" font-weight="normal">có phần cứng EN,</text><text x="705" y="237.2" text-anchor="middle" font-size="12" font-weight="normal">đã OFF ≥ 100 ms</text><text x="705" y="253.2" text-anchor="middle" font-size="12" font-weight="normal">(bật EN)</text><polyline points="1010,280 1120,280" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1065" y="234.2" text-anchor="middle" font-size="12" font-weight="normal">sau 400 ms,</text><text x="1065" y="250.2" text-anchor="middle" font-size="12" font-weight="normal">không lỗi</text><polyline points="1245,230 1245,110 525,110 525,230" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="885" y="99.55" text-anchor="middle" font-size="13" font-weight="normal">yêu cầu tắt (tắt EN)</text><polyline points="885,230 885,160 525,160" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="705" y="154.55" text-anchor="middle" font-size="13" font-weight="normal">yêu cầu tắt (tắt EN)</text><polyline points="885,330 885,500" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="897" y="396.05" text-anchor="start" font-size="13" font-weight="normal">FT của DCM hoặc</text><text x="897" y="413.05" text-anchor="start" font-size="13" font-weight="normal">ALERT (cắt EN ngay)</text><polyline points="1245,330 1245,550 1010,550" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="1257" y="427.55" text-anchor="start" font-size="13" font-weight="normal">ALERT (đường nhanh),</text><text x="1257" y="444.55" text-anchor="start" font-size="13" font-weight="normal">FT, vượt ngưỡng 2 mẫu</text><text x="1257" y="461.55" text-anchor="start" font-size="13" font-weight="normal">(cắt EN)</text><polyline points="760,550 525,550 525,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><text x="640" y="568.05" text-anchor="middle" font-size="13" font-weight="normal">ClearTrip (xóa lỗi toàn PSU,</text><text x="640" y="585.05" text-anchor="middle" font-size="13" font-weight="normal">hủy yêu cầu bật)</text><text x="165" y="374.55" text-anchor="middle" font-size="13" font-weight="normal">Reset: mọi cụm EN = 0</text><polyline points="165,350 165,330" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#a)" /><rect x="40" y="610" width="1420" height="60" rx="8" fill="#fff" stroke="#000" stroke-width="1.4" stroke-dasharray="7 5"/><text x="750.0" y="644.55" text-anchor="middle" font-size="13" font-weight="normal">Lỗi phần mềm nghiêm trọng (HardFault, NMI, Error_Handler...): Safety_ForceOff cắt mọi chân EN ở mọi trạng thái, rồi chờ watchdog reset</text></svg>